<svg viewBox="0 0 320 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Grupo del Símbolo / Rosa de los Vientos Vininto -->
  <g transform="translate(60, 60)">
    <!-- Puntas verticales superior e inferior en tono oscuro/vininto -->
    <polygon points="0,-45 5,-12 0,-8 -5,-12" fill="#7f1d1d"/>
    <polygon points="0,45 5,12 0,8 -5,12" fill="#7f1d1d"/>
    
    <!-- Arco envolvente vininto (guinda) -->
    <path d="M -32,-35 C -55,-25 -58,25 -28,38" fill="none" stroke="#881337" stroke-width="7" stroke-linecap="round"/>
    <path d="M 32,-35 C 55,-25 58,25 28,38" fill="none" stroke="#881337" stroke-width="7" stroke-linecap="round"/>

    <!-- Estrellas y Rosa de los Vientos Central con detalles en rojo, blanco y dorado -->
    <circle cx="0" cy="0" r="28" fill="#881337"/>
    <circle cx="0" cy="0" r="23" fill="#dc2626"/>
    
    <!-- Puntas de la estrella central -->
    <polygon points="0,-24 5,-6 24,0 5,6 0,24 -5,6 -24,0 -5,-6" fill="#ffffff"/>
    <polygon points="0,-18 3,-4 18,0 3,4 0,18 -3,4 -18,0 -3,-4" fill="#fef08a"/>
    <polygon points="0,0 12,-12 18,0 12,12 0,18 -12,12 -18,0 -12,-12" fill="#ffffff" transform="rotate(45)"/>
    
    <!-- Centro de la brújula -->
    <circle cx="0" cy="0" r="4.5" fill="#7f1d1d" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Tipografía Oficial CTPMN y CTP MERCEDES NORTE -->
  <text x="132" y="55" fill="#881337" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" letter-spacing="1">CTPMN</text>
  <text x="134" y="82" fill="#334155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2.5">CTP MERCEDES NORTE</text>
</svg>