<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <!-- Fondo circular rojo profundo característico de la TPMN -->
  <circle cx="100" cy="100" r="95" fill="url(#redGlow)" stroke="#fef08a" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  {/* Rosa de los Vientos Estilizada */}
  <g transform="translate(100, 100)">
    <!-- Puntas Principales -->
    <polygon points="0,-85 12,-25 65,-6 18,12 8,65 0,20 -8,65 -18,12 -65,-6 -12,-25" fill="#ffffff"/>
    <polygon points="0,-75 9,-22 55,-5 15,10 6,55 0,18 -6,55 -15,10 -55,-5 -9,-22" fill="#fef08a"/>
    <!-- Estrellas secundarias diagonal -->
    <polygon points="0,0 25,-25 45,0 25,25" fill="#ffffff" transform="rotate(45)"/>
    <polygon points="0,0 20,-20 35,0 20,20" fill="#fef08a" transform="rotate(45)"/>
    <!-- Núcleo central -->
    <circle cx="0" cy="0" r="14" fill="#7f1d1d" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#fef08a"/>
  </g>
</svg>