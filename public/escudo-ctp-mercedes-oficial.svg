<svg viewBox="0 0 300 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Corona de laurel exterior con frutos dorados -->
  <path d="M150 360 Q90 320, 50 250 T30 150 Q30 90, 80 50 T150 15" fill="none" stroke="#15803d" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 360 Q210 320, 250 250 T270 150 Q270 90, 220 50 T150 15" fill="none" stroke="#15803d" stroke-width="12" stroke-linecap="round"/>
  <!-- Frutos dorados (café/naranja de la región) -->
  <circle cx="70" cy="200" r="8" fill="#eab308"/><circle cx="55" cy="160" r="8" fill="#eab308"/><circle cx="90" cy="240" r="8" fill="#eab308"/>
  <circle cx="230" cy="200" r="8" fill="#eab308"/><circle cx="245" cy="160" r="8" fill="#eab308"/><circle cx="210" cy="240" r="8" fill="#eab308"/>

  <!-- Escudo Blanco Central -->
  <path d="M90 60 L210 60 Q240 60, 240 100 Q240 240, 150 320 Q60 240, 60 100 Q60 60, 90 60 Z" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  
  <!-- Ribete superior empenachado -->
  <path d="M80 60 L80 35 L100 35 L100 50 L120 50 L120 35 L150 35 L180 35 L180 50 L200 50 L200 35 L220 35 L220 60 Z" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>

  <!-- Textos del Escudo -->
  <text x="150" y="85" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">COLEGIO TECNICO PROFESIONAL</text>
  <path id="curveText" d="M 80,120 Q 150,140 220,120" fill="transparent"/>
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#0f172a"><textPath href="#curveText" startOffset="50%" text-anchor="middle">MERCEDES NORTE</textPath></text>

  <!-- Sol radiante inferior -->
  <path d="M 80 250 Q 150 180, 220 250 Z" fill="#fde047" opacity="0.6"/>

  <!-- Libro abierto con computadora y llave -->
  <g transform="translate(100, 190)">
    <path d="M0 40 Q25 20, 50 35 L50 90 Q25 75, 0 90 Z" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
    <path d="M50 35 Q75 20, 100 40 L100 90 Q75 75, 50 90 Z" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
    <!-- Monitor y Llave -->
    <rect x="15" y="45" width="22" height="16" rx="2" fill="#0369a1" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="45" x2="80" y2="70" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cinta inferior Heredia 2012 -->
  <path d="M80 300 L220 300 L200 330 L100 330 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
  <text x="150" y="322" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#0f172a" text-anchor="middle">HEREDIA 2012</text>
</svg>