project_id = "practicatecnica-v11"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "20MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/verificar", "http://localhost:3000/recuperar", "http://localhost:3000/confirmar-correo"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_expiry = 3600
[auth.mfa]
max_enrolled_factors = 1
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.mail-worker]
# Handler authenticates a service-to-service secret, not an end-user JWT.
verify_jwt = false
