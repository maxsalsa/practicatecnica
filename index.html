    <script>
      (function () {
        const VERSION_ACTUAL = 'MEP-CTP-MERCEDES-NORTE-PROD';
        if (localStorage.getItem('pt_pwa_version') !== VERSION_ACTUAL) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (let reg of regs) { reg.unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) { caches.delete(name); }
            });
          }
          localStorage.setItem('pt_pwa_version', VERSION_ACTUAL);
          localStorage.removeItem('pt_avance_simulacro_v28_5');
        }
      })();
    </script>
