    <script>
      // Escudo QA Soberano: elimina cualquier widget o insignia externa inyectada en el DOM
      (function() {
        const cleanExternalBadges = () => {
          const selectors = [
            '#lovable-badge',
            '[id*="lovable"]',
            '[class*="lovable"]',
            'a[href*="lovable.dev"]',
            'iframe[src*="lovable"]',
            'script[src*="gpteng"]',
            'script[src*="lovable"]'
          ];
          document.querySelectorAll(selectors.join(',')).forEach((el) => el.remove());
        };
        document.addEventListener('DOMContentLoaded', cleanExternalBadges);
        const obs = new MutationObserver(cleanExternalBadges);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
