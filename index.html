<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>pracTICAtecnica.com | Ecosistema Educativo MEP, CTP, Académicos & Universidades</title>
    <script>
      // Purga automática de Service Workers y Caches antiguos que muestran la versión vieja
      (function () {
        const VERSION_ACTUAL = 'v26.9.0-BDS-QA-TOTAL';
        const verGuardada = localStorage.getItem('pt_pwa_version');
        if (verGuardada !== VERSION_ACTUAL) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (let reg of regs) {
                reg.unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
          localStorage.setItem('pt_pwa_version', VERSION_ACTUAL);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
